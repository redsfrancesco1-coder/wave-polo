name: Verifica aggiornamento FIN

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica progetto
        uses: actions/checkout@v4
      - name: Prepara Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controlla sintassi programma FIN
        run: node --check scripts/update-fin.mjs
